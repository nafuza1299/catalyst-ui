name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # build first: vite empties dist/, and build:storybook writes into dist/storybook.
      - run: npm run build
      # Lighthouse audits dist/ while it still holds only the app. Running it
      # after build:storybook would make lhci discover Storybook's index.html
      # and iframe.html too, and audit those against the app's thresholds.
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
      - run: npm run build:storybook
